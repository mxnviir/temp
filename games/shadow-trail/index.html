/* =====================================================================
   Map editor
   ===================================================================== */
const blankMap = () => ({v:1, name:'My map', w:1200, h:900, nodes:[], edges:[], starts:[], style:{lines:true, labels:true, size:14}});
const Editor = {
  map:blankMap(), prepared:null, tool:'add', etype:'taxi', sel:null, hist:[], dirty:false, msg:'', report:null, raf:0,
  open(){
    readSetup();
    this.map = customRaw ? clone(customRaw) : blankMap();
    this.map.style = Object.assign({lines:true, labels:true, size:14}, this.map.style || {});
    this.map.image = customImage;
    this.sel = null; this.hist = []; this.dirty = false; this.msg = ''; this.report = null;
    screen = 'editor'; this.prepared = prepare(this.map);
    drawnMap = null; render(); View.fitTo(this.map);
  },
  refresh(){ this.prepared = prepare(this.map); render(); },
  snap(){ const m = Object.assign({}, this.map, {image:null}); this.hist.push(JSON.stringify(m)); if (this.hist.length > 150) this.hist.shift(); this.dirty = true; this.report = null; this.msg = ''; },
  undo(){ const s = this.hist.pop(); if (!s) return; const img = this.map.image; this.map = JSON.parse(s); this.map.image = img; this.sel = null; this.refresh(); },
  nextId(){ return this.map.nodes.reduce((m, n) => Math.max(m, n.id), 0) + 1; },
  node(id){ return this.map.nodes.find(n => n.id === id); },
  tap(id, pt){
    const m = this.map;
    switch (this.tool){
      case 'add':
        if (id != null){ this.sel = id; break; }
        if (pt.x < 0 || pt.y < 0 || pt.x > m.w || pt.y > m.h) break;
        this.snap();
        { const nid = this.nextId(); m.nodes.push({id:nid, x:+(pt.x / m.w).toFixed(5), y:+(pt.y / m.h).toFixed(5)}); this.sel = nid; }
        break;
      case 'move': this.sel = id; break;
      case 'connect':
        if (id == null){ this.sel = null; break; }
        if (this.sel == null || this.sel === id || !this.node(this.sel)){ this.sel = this.sel === id ? null : id; break; }
        this.snap(); this.toggleEdge(this.sel, id, this.etype); this.sel = id;
        break;
      case 'start':
        if (id == null) break;
        this.snap(); m.starts = m.starts.includes(id) ? m.starts.filter(s => s !== id) : m.starts.concat(id); this.sel = id;
        break;
      case 'delete':
        if (id == null) break;
        this.snap(); this.removeNode(id);
        break;
    }
    this.refresh();
  },
  toggleEdge(a, b, t){
    const i = this.map.edges.findIndex(e => e.t === t && ((e.a === a && e.b === b) || (e.a === b && e.b === a)));
    if (i >= 0) this.map.edges.splice(i, 1); else this.map.edges.push({a, b, t});
  },
  removeNode(id){
    const m = this.map;
    m.nodes = m.nodes.filter(n => n.id !== id);
    m.edges = m.edges.filter(e => e.a !== id && e.b !== id);
    m.starts = m.starts.filter(s => s !== id);
    if (this.sel === id) this.sel = null;
  },
  dragTo(id, pt){
    const n = this.node(id); if (!n) return;
    n.x = +clamp(pt.x / this.map.w, 0, 1).toFixed(5); n.y = +clamp(pt.y / this.map.h, 0, 1).toFixed(5);
    this.sel = id;
    if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.prepared = prepare(this.map); renderBoard(); });
  },
  renumber(v){
    const id = this.sel, nv = parseInt(v, 10);
    if (id == null) return;
    if (!Number.isInteger(nv) || nv < 1){ this.msg = 'Use a whole number from 1 up.'; return this.refresh(); }
    if (nv !== id && this.node(nv)){ this.msg = `Number ${nv} is already on the map.`; return this.refresh(); }
    if (nv === id) return;
    this.snap();
    this.node(id).id = nv;
    this.map.edges.forEach(e => { if (e.a === id) e.a = nv; if (e.b === id) e.b = nv; });
    this.map.starts = this.map.starts.map(s => s === id ? nv : s);
    this.sel = nv; this.msg = `Crossing ${id} is now ${nv}.`; this.refresh();
  },
  drawOverlay(){
    const m = this.prepared, R = m.style.size, s = R / 19;
    for (const id of m.starts){ const n = m.byId.get(id); if (n) mk('circle', {cx:n.px, cy:n.py, r:R * 1.5, class:'ed-start', 'stroke-width':3 * s, 'stroke-dasharray':`${3 * s} ${3 * s}`}, L.edit); }
    const n = this.sel != null && m.byId.get(this.sel);
    if (n){
      mk('circle', {cx:n.px, cy:n.py, r:R * 1.8, class:'ed-sel', 'stroke-width':5 * s}, L.edit);
      if (!m.style.labels) mk('text', {x:n.px, y:n.py - R * 2.4, class:'n-label', 'font-size':R * 1.1}, L.edit).textContent = n.id;
    }
  },
  async save(){
    const name = ($('#e-name') && $('#e-name').value.trim()) || 'My map';
    this.map.name = name;
    const raw = Object.assign({}, this.map); delete raw.image; raw.v = 1;
    if (!Store.set(KEYS.map, raw)){ this.msg = 'This browser would not save the map. Its storage may be full or turned off.'; return this.refresh(); }
    customRaw = clone(raw);
    const ok = await Store.setAsset('mapImage', this.map.image || null);
    customImage = this.map.image || null;
    mapCache = {src:null, img:null, m:null};
    this.dirty = false; setupCfg.map = 'custom'; Store.set(KEYS.setup, setupCfg);
    this.msg = ok || !this.map.image ? `Saved “${name}”. Choose it under Map when you start a game.` : 'Saved the crossings and links, but this browser would not store the background picture.';
    this.refresh();
  },
  exportJson(){ const raw = Object.assign({}, this.map); delete raw.image; raw.name = ($('#e-name') && $('#e-name').value.trim()) || raw.name; return JSON.stringify(raw); },
  importJson(text){
    let d;
    try { d = JSON.parse(text); } catch (e) { return 'That is not valid JSON.'; }
    if (!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) return 'The JSON needs "nodes" and "edges" lists.';
    const nodes = d.nodes.map(n => ({id:Number(n.id), x:Number(n.x), y:Number(n.y)}));
    if (nodes.some(n => !Number.isFinite(n.x) || !Number.isFinite(n.y))) return 'Every crossing needs numeric x and y between 0 and 1.';
    const edges = d.edges.map(e => ({a:Number(e.a), b:Number(e.b), t:String(e.t)}));
    this.snap();
    const img = typeof d.image === 'string' && d.image.startsWith('data:image') ? d.image : this.map.image;
    this.map = {v:1, name:String(d.name || 'Imported map'), w:Number(d.w) > 0 ? Number(d.w) : 1200, h:Number(d.h) > 0 ? Number(d.h) : 900, nodes, edges,
      starts:Array.isArray(d.starts) ? d.starts.map(Number) : [], style:Object.assign({lines:true, labels:true, size:14}, d.style || {}), image:img};
    this.sel = null; drawnMap = null; this.prepared = prepare(this.map);
    this.report = validateMap(this.map, 0);
    this.msg = `Imported ${nodes.length} crossings and ${edges.length} links.`;
    return null;
  },
  loadImage(file){
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        this.snap();
        this.map.image = r.result; this.map.w = 1200; this.map.h = Math.round(1200 * img.naturalHeight / img.naturalWidth);
        this.prepared = prepare(this.map); drawnMap = null;
        this.msg = `Background set (${img.naturalWidth} × ${img.naturalHeight} pixels). Crossings keep their place relative to the picture.`;
        render();
      };
      img.onerror = () => { this.msg = 'That file could not be opened as a picture.'; render(); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  },
  panel(){
    const m = this.map, pm = this.prepared;
    const tools = [['add', 'Add'], ['move', 'Move'], ['connect', 'Connect'], ['start', 'Start spots'], ['delete', 'Delete']];
    const help = {
      add:'Tap an empty spot to add a crossing. It gets the next free number, which you can change below.',
      move:'Drag a crossing to move it. Drag empty space to pan.',
      connect:`Tap one crossing, then another, to add or remove a ${TK[this.etype].label} link. The second crossing stays selected, so you can trace a whole route tap by tap.`,
      start:'Tap crossings to mark them as possible starting spots (green dashed rings).',
      delete:'Tap a crossing to delete it and all of its links.'
    }[this.tool];
    const counts = EDGE_KINDS.map(t => `${m.edges.filter(e => e.t === t).length} ${TK[t].label}`).join(' · ');
    const sel = this.sel != null && pm.byId.get(this.sel);
    let selHtml = '<p class="hint">Tap a crossing to see and edit it.</p>';
    if (sel){
      const links = pm.adj.get(sel.id).slice().sort((a, b) => a.t.localeCompare(b.t) || a.to - b.to);
      selHtml = `<div class="grid2" style="align-items:end"><div class="field"><label for="e-num">Number</label><input class="inp mono" id="e-num" type="number" min="1" value="${sel.id}"></div><button type="button" class="secondary" data-act="e-renum">Apply number</button></div>
        ${links.length ? `<ul class="loglist">${links.map(l => `<li><span class="tn">${sel.id}</span><span class="tt k-${l.t}">${TK[l.t].label}</span><span class="tx" style="display:flex;justify-content:space-between;gap:8px">to ${l.to}<button type="button" class="link" data-act="e-del-edge" data-a="${sel.id}" data-b="${l.to}" data-t="${l.t}">Remove</button></span></li>`).join('')}</ul>` : '<p class="hint">No links yet. Use Connect to add some.</p>'}
        <p class="hint">${pm.starts.includes(sel.id) ? 'This is a starting spot.' : 'Not a starting spot.'}</p>`;
    }
    const rep = this.report;
    return `<div class="card turn-head"><span class="eyebrow">Map editor</span><h2>Build a map</h2>
        <p>Only the numbered crossings you add are playable. Lines in a background picture mean nothing to the game until you add them as links.</p></div>
      ${this.msg ? `<div class="alert">${esc(this.msg)}</div>` : ''}
      <div class="card"><div class="field"><label for="e-name">Map name</label><input class="inp" id="e-name" maxlength="40" value="${esc(m.name)}"></div>
        <div class="actions"><label class="secondary filebtn">${m.image ? 'Change picture' : 'Choose background picture'}<input type="file" accept="image/*" id="e-img" hidden></label>${m.image ? '<button type="button" class="secondary" data-act="e-img-clear">Remove picture</button>' : ''}</div></div>
      <div class="card"><span class="eyebrow">Tool</span><div class="seg">${tools.map(([k, l]) => `<button type="button" data-act="e-tool" data-v="${k}" aria-pressed="${this.tool === k}">${l}</button>`).join('')}</div>
        ${this.tool === 'connect' ? `<span class="eyebrow">Link type</span><div class="seg">${EDGE_KINDS.map(t => `<button type="button" data-act="e-type" data-v="${t}" aria-pressed="${this.etype === t}">${TK[t].label}</button>`).join('')}</div>` : ''}
        <p class="hint">${help}</p>
        <div class="actions"><button type="button" class="secondary small" data-act="e-undo"${this.hist.length ? '' : ' disabled'}>Undo edit</button></div></div>
      <div class="card"><span class="eyebrow">Selected crossing</span>${selHtml}</div>
      <div class="card"><span class="eyebrow">Display</span>
        <button type="button" class="toggle" data-act="e-style" data-k="lines" aria-pressed="${m.style.lines}"><span>Draw links on the map</span><span class="sw"></span></button>
        <button type="button" class="toggle" data-act="e-style" data-k="labels" aria-pressed="${m.style.labels}"><span>Numbered markers (off shows rings only)</span><span class="sw"></span></button>
        <div class="field"><label for="e-size">Marker size</label><input type="range" id="e-size" min="6" max="30" value="${m.style.size}" style="accent-color:var(--smoke)"></div></div>
      <div class="card"><span class="eyebrow">${m.nodes.length} crossings · ${m.starts.length} starting spots</span><p class="hint">${counts}</p>
        <div class="actions"><button type="button" class="secondary" data-act="e-check">Check map</button><button type="button" class="primary" data-act="e-save">Save map</button></div>
        ${rep ? (rep.errors.length || rep.warnings.length ? `${rep.errors.length ? `<ul class="vlist err">${rep.errors.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}${rep.warnings.length ? `<ul class="vlist warn">${rep.warnings.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}` : '<div class="alert good">No problems found.</div>') : ''}
        <div class="actions"><button type="button" class="secondary small" data-act="e-export">Export JSON</button><button type="button" class="secondary small" data-act="e-import">Import JSON</button></div>
        <div class="actions"><button type="button" class="secondary small" data-act="e-sample">Start from a copy of Port Veyra</button><button type="button" class="secondary small danger" data-act="e-clear">Clear map</button></div></div>`;
  }
};

/* =====================================================================
   Actions
   ===================================================================== */
let rpTimer = null;
function stopReplay(){ if (rpTimer){ clearInterval(rpTimer); rpTimer = null; } ui.playing = null; }
function setReplay(k){
  if (!state) return;
  ui.replay = clamp(k, 0, state.events.length);
  renderBoard();
  const r = $('#rpRange'), t = $('#rpText');
  if (r) r.value = ui.replay;
  if (t) t.innerHTML = replayText(ui.replay);
}
function leaveEditor(){ screen = 'setup'; drawnMap = null; render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, d = b.dataset;
  if (act !== 'rp-play' && act !== 'rp') stopReplay();
  switch (act){
    /* board */
    case 'zoom-in': View.zoom(1.3); break;
    case 'zoom-out': View.zoom(1 / 1.3); break;
    case 'fit': View.fit(); break;
    case 'fullscreen':
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      } catch (err) {}
      break;
    /* header */
    case 'undo': undo(); break;
    case 'pause': ui.paused = !ui.paused; render(); break;
    case 'rules': openModal(`<h3>How to play</h3><div class="rules">${rulesList(state && screen === 'game' ? state.cfg : setupCfg)}</div><button type="button" class="primary" data-act="close">Got it</button>`); break;
    case 'end': openModal(`<h3>End this game?</h3><p>The game stops now with no winner, and the Shadow's route is shown to everyone.</p><div class="actions"><button type="button" class="secondary" data-act="close">Keep playing</button><button type="button" class="primary" data-act="confirm-end">End game</button></div>`); break;
    case 'confirm-end': closeModal(); endGame(null, 'The game was ended before anyone won.'); break;
    case 'menu':
      if (screen === 'editor'){
        if (Editor.dirty) openModal(`<h3>Leave the editor?</h3><p>Changes since your last save will be lost.</p><div class="actions"><button type="button" class="secondary" data-act="close">Stay</button><button type="button" class="primary" data-act="confirm-leave-editor">Leave without saving</button></div>`);
        else leaveEditor();
      } else { ui.paused = false; screen = 'setup'; render(); }
      break;
    case 'confirm-leave-editor': closeModal(); leaveEditor(); break;
    case 'close': closeModal(); break;
    /* setup */
    case 'set': readSetup(); setupCfg[d.k] = d.k === 'agentCount' ? +d.v : d.v; Store.set(KEYS.setup, setupCfg); ui.setupErr = ''; renderSetup(); break;
    case 'toggle': readSetup(); setupCfg[d.k] = !setupCfg[d.k]; Store.set(KEYS.setup, setupCfg); renderSetup(); renderHeader(); break;
    case 'defaults': setupCfg = clone(DEFAULT_CFG); Store.set(KEYS.setup, setupCfg); ui.setupErr = ''; renderSetup(); break;
    case 'resume': {
      const s = loadGame(); if (!s) break;
      if (s.mapKey === 'custom' && !s.mapData){ ui.setupErr = 'That saved game used a map that is no longer available.'; renderSetup(); break; }
      state = s; history = []; resetUi(); ui.paused = false; ui.replay = state.phase === 'over' ? state.events.length : null;
      if (state.view === 'shadow') state.view = 'cover-shadow';
      if (state.view === 'place-shadow') state.view = 'cover-place-shadow';
      screen = 'game'; drawnMap = null; render(); break; }
    case 'open-editor': Editor.open(); break;
    /* hand-offs */
    case 'show-shadow':
      state.view = 'shadow'; resetUi(); saveGame(); render(); View.centerOn(state.shadow.pos);
      if (!state.shadowDone && shadowOptions().size === 0) endGame('agents', `${state.shadow.name} is cornered at ${state.shadow.pos} with no way out.`);
      break;
    case 'show-place-shadow': state.view = 'place-shadow'; resetUi(); saveGame(); render(); break;
    case 'show-agents': state.view = 'agents'; resetUi(); saveGame(); render(); View.centerOn(state.agents[state.turnAgent].pos); break;
    case 'pass': state.phase = 'agents'; state.view = 'cover-agents'; state.turnAgent = 0; state.agentsDone = false; history = []; resetUi(); saveGame(); render(); break;
    case 'end-round': endRound(); break;
    case 'skip': pushHistory('agents'); resetUi(); advanceAgent(); break;
    /* moving */
    case 'mode': ui.mode = d.m || null; ui.selected = null; render(); break;
    case 'pick': ui.selected = +d.to; ui.inspect = +d.to; render(); break;
    case 'go-via': ui.mode = d.t; ui.selected = +d.to; render(); break;
    case 'cancel': ui.selected = null; render(); break;
    case 'confirm': commitMove(); break;
    case 'uninspect': ui.inspect = null; render(); break;
    case 'confirm-place': {
      const id = ui.selected; if (!placeOptions().includes(id)) break;
      if (state.view === 'place-agents'){
        const a = state.agents[state.turnAgent]; a.pos = a.start = id; state.turnAgent++;
        if (state.turnAgent >= state.agents.length){ state.turnAgent = 0; state.view = 'cover-place-shadow'; }
      } else { state.shadow.pos = state.shadow.start = id; beginPlay(true); }
      resetUi(); saveGame(); render(); break; }
    case 'double': if (state.double.step !== 2){ state.double = state.double.armed ? {armed:false, step:0} : {armed:true, step:1}; saveGame(); render(); } break;
    case 'tracker': ui.showSuspects = !ui.showSuspects; render(); break;
    /* replay */
    case 'rp': setReplay((ui.replay ?? state.events.length) + Number(d.d)); break;
    case 'rp-play':
      if (rpTimer){ stopReplay(); b.textContent = 'Play'; break; }
      if ((ui.replay ?? 0) >= state.events.length) setReplay(0);
      ui.playing = true; b.textContent = 'Pause';
      rpTimer = setInterval(() => { if (!state || ui.replay >= state.events.length){ stopReplay(); const pb = $('#rpPlay'); if (pb) pb.textContent = 'Play'; return; } setReplay(ui.replay + 1); }, 700);
      break;
    /* editor */
    case 'e-tool': Editor.tool = d.v; render(); break;
    case 'e-type': Editor.etype = d.v; render(); break;
    case 'e-undo': Editor.undo(); break;
    case 'e-renum': Editor.renumber($('#e-num').value); break;
    case 'e-del-edge': Editor.snap(); Editor.toggleEdge(+d.a, +d.b, d.t); Editor.refresh(); break;
    case 'e-style': Editor.snap(); Editor.map.style[d.k] = !Editor.map.style[d.k]; Editor.refresh(); break;
    case 'e-img-clear': Editor.snap(); Editor.map.image = null; Editor.prepared = prepare(Editor.map); drawnMap = null; render(); break;
    case 'e-check': Editor.report = validateMap(Editor.map, 0); render(); break;
    case 'e-save': Editor.save(); break;
    case 'e-export': {
      const json = Editor.exportJson();
      openModal(`<h3>Export map</h3><p>Copy this text to keep a backup or move the map to another device. The background picture is not included.</p>
        <textarea class="inp" id="exportText" readonly>${esc(json)}</textarea>
        <div class="actions"><button type="button" class="primary" data-act="copy-export">Copy</button><a class="secondary filebtn" id="dlLink" download="shadow-trail-map.json">Download file</a><button type="button" class="secondary" data-act="close">Close</button></div><p class="hint" id="copyMsg"></p>`);
      try { $('#dlLink').href = URL.createObjectURL(new Blob([json], {type:'application/json'})); } catch (err) { $('#dlLink').hidden = true; }
      break; }
    case 'copy-export': {
      const t = $('#exportText');
      const done = ok => { $('#copyMsg').textContent = ok ? 'Copied.' : 'Copying did not work here. The text is selected, so copy it by hand.'; if (!ok){ t.focus(); t.select(); } };
      try { navigator.clipboard.writeText(t.value).then(() => done(true), () => done(false)); } catch (err) { done(false); }
      break; }
    case 'e-import':
      openModal(`<h3>Import map</h3><p>Paste exported map JSON, or choose a .json file. This replaces the map in the editor; Undo edit brings the old one back.</p>
        <textarea class="inp" id="importText" placeholder='{"nodes":[...],"edges":[...]}'></textarea>
        <label class="secondary filebtn">Choose a .json file<input type="file" accept=".json,application/json" id="importFile" hidden></label>
        <p class="err-box" id="importErr"></p>
        <div class="actions"><button type="button" class="secondary" data-act="close">Cancel</button><button type="button" class="primary" data-act="import-apply">Import</button></div>`);
      break;
    case 'import-apply': { const err = Editor.importJson($('#importText').value); if (err){ $('#importErr').textContent = err; break; } closeModal(); render(); View.fitTo(Editor.map); break; }
    case 'e-sample': {
      Editor.snap();
      const c = clone(BUILTIN_RAW); delete c.decor; delete c.builtin; c.name = 'Port Veyra copy'; c.image = Editor.map.image;
      Editor.map = c; Editor.sel = null; Editor.prepared = prepare(c); drawnMap = null; Editor.msg = 'Loaded a copy of Port Veyra. Edit it, then save it as your own map.'; render(); break; }
    case 'e-clear': openModal(`<h3>Clear the map?</h3><p>This removes every crossing and link from the editor. Undo edit brings them back.</p><div class="actions"><button type="button" class="secondary" data-act="close">Keep them</button><button type="button" class="primary" data-act="e-clear-yes">Clear map</button></div>`); break;
    case 'e-clear-yes': closeModal(); Editor.snap(); Editor.map.nodes = []; Editor.map.edges = []; Editor.map.starts = []; Editor.sel = null; Editor.refresh(); break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'setupForm'){ e.preventDefault(); startFromSetup(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'e-img' && t.files[0]) Editor.loadImage(t.files[0]);
  if (t.id === 'e-name'){ Editor.map.name = t.value; Editor.dirty = true; }
  if (t.id === 'importFile' && t.files[0]){ const r = new FileReader(); r.onload = () => { $('#importText').value = r.result; }; r.readAsText(t.files[0]); }
  if (t.closest && t.closest('#setupForm')) readSetup();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rpRange'){ stopReplay(); setReplay(+t.value); const pb = $('#rpPlay'); if (pb) pb.textContent = 'Play'; }
  if (t.id === 'e-size'){ Editor.map.style.size = +t.value; Editor.dirty = true; Editor.prepared = prepare(Editor.map); renderBoard(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#modal').hidden) closeModal();
  else if (screen === 'game' && ui.selected){ ui.selected = null; render(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('fullscreenchange', () => { $('#fsBtn').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

/* =====================================================================
   Boot
   ===================================================================== */
function start(data){
  if (data && data.state){
    state = data.state; screen = data.screen === 'game' ? 'game' : 'setup';
    if (state.view === 'shadow') state.view = 'cover-shadow';
    if (state.view === 'place-shadow') state.view = 'cover-place-shadow';
  }
  render();
  Store.getAsset('mapImage').then(img => { if (img){ customImage = img; mapCache = {src:null, img:null, m:null}; render(); } });
}
try { window.claude?.hot?.snapshot?.(() => ({state, screen})); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
