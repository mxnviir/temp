<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a pan-and-zoom transit map beside a dispatch panel; the panel drops below the map on phones */
:root{
  --ink:#0a0f1a; --ground:#0e1625; --block:#142136; --park:#11302b; --panel:#121c2d; --raise:#18243a; --line:#26344d;
  --text:#e9eef7; --muted:#8c9bb4; --node:#1a2740; --node-edge:#3d4e6e;
  --taxi:#f3b53f; --bus:#33c7a0; --train:#ff5d6c; --smoke:#a98cff; --river:#15345a; --river-edge:#1d4673; --ok:#7fd99a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--smoke);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.no-motion *{animation:none!important;transition:none!important}

#app{min-height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:900;font-size:28px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.status{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1 1 auto;text-align:right;min-width:0}
.status b{color:var(--text)}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.ghost-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted)}
.ghost-btn:hover:not(:disabled){color:var(--text);border-color:var(--node-edge)}
.ghost-btn:disabled{opacity:.35}
@media (max-width:640px){.brand span{display:none}.brand b{font-size:24px}.status{flex-basis:100%;text-align:left;order:3}}

.game{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board{position:relative;min-width:0;height:calc(100dvh - 92px);min-height:420px;display:flex;flex-direction:column;gap:8px}
#map{flex:1;min-height:0;width:100%;display:block;background:var(--ground);border:1px solid var(--line);border-radius:14px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.dragging{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.tools button{min-width:38px;height:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:rgba(18,28,45,.92);font-size:14px}
.tools button.sym{font-size:20px;line-height:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted);flex:none}
.legend i{display:inline-block;width:22px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0;max-height:calc(100dvh - 92px);overflow:auto;padding-bottom:12px}
@media (max-width:900px){
  .game{grid-template-columns:minmax(0,1fr);gap:14px}
  .board{height:66dvh;min-height:320px}
  .panel{max-height:none;overflow:visible}
}

/* SVG map */
.ground{fill:var(--ground)}
.blk{fill:var(--block)} .blk.park{fill:var(--park)}
.river{fill:none;stroke:var(--river);stroke-linecap:round}
.river-edge{fill:none;stroke:var(--river-edge);stroke-linecap:round}
.river-name{font-family:var(--f-mono);letter-spacing:.5em;fill:#4f7fb3}
.e{fill:none;stroke-linecap:round}
.e-taxi{stroke:var(--taxi);opacity:.62}
.e-casing{stroke:var(--node-edge)}
.e-bus{stroke:var(--bus);opacity:.85}
.e-train{stroke:var(--train);opacity:.85}
.e-ferry{stroke:var(--smoke);opacity:.9}
.n-core{fill:var(--node);stroke:var(--node-edge)}
.n-core.bus{stroke:var(--bus)}
.n-ring{fill:rgba(10,15,26,.15);stroke:#fff;stroke-opacity:.85}
.n-train{fill:none;stroke:var(--train)}
.n-pier{fill:none;stroke:var(--smoke)}
.n-label{font-family:var(--f-mono);font-weight:600;fill:var(--text);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.suspect{fill:var(--smoke);fill-opacity:.24;stroke:var(--smoke);stroke-opacity:.6}
.dest{fill:#fff;fill-opacity:.08;stroke:#fff;animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.dest.faint{stroke-opacity:.38;fill-opacity:0;animation:none}
.dest.picked{stroke:var(--smoke);fill:var(--smoke);fill-opacity:.28;animation:none}
.inspect{fill:none;stroke:#fff;stroke-opacity:.9}
.cur-ring{fill:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{stroke-opacity:.25}}
.tok-label{font-family:var(--f-mono);font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.seen-ring{fill:none;stroke:var(--smoke)}
.seen-tag{fill:var(--smoke)}
.seen-text{font-family:var(--f-mono);font-weight:600;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.route{fill:none;stroke:var(--smoke);stroke-linejoin:round;stroke-linecap:round;opacity:.8}
.route-dot{fill:var(--smoke)}
.hit{fill:transparent}
.ed-start{fill:none;stroke:var(--ok)}
.ed-sel{fill:none;stroke:var(--smoke)}
@media (prefers-reduced-motion:reduce){.dest,.cur-ring{animation:none}}

/* Panel */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.turn-head h2{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;letter-spacing:.03em;text-transform:uppercase;margin:2px 0 4px;text-wrap:balance;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.turn-head p{margin:0;color:var(--muted)}
.turn-head p b{color:var(--text)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--c,currentColor);background:var(--c,currentColor)}
.diamond{width:16px;height:16px;flex:none;background:var(--smoke);transform:rotate(45deg);border-radius:2px}
.alert{border-radius:10px;padding:10px 12px;font-size:14px;background:rgba(169,140,255,.14);border:1px solid rgba(169,140,255,.45)}
.alert.hot{background:rgba(255,93,108,.13);border-color:rgba(255,93,108,.5)}
.alert.good{background:rgba(127,217,154,.12);border-color:rgba(127,217,154,.45)}
.alert b{font-family:var(--f-mono)}
.wallet{display:flex;flex-wrap:wrap;gap:6px}
.tk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;background:var(--raise);border:1px solid var(--line)}
.tk b{font-family:var(--f-mono);min-width:24px;height:22px;padding:0 4px;border-radius:999px;display:inline-grid;place-items:center;color:var(--ink);font-size:12px;background:var(--tc)}
.tk.zero{opacity:.4}
.k-taxi{--tc:var(--taxi)} .k-bus{--tc:var(--bus)} .k-train{--tc:var(--train)} .k-smoke{--tc:var(--smoke)} .k-double{--tc:var(--text)} .k-ferry{--tc:var(--smoke)}
.step{display:flex;flex-direction:column;gap:10px}
.step-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px 0;color:var(--smoke);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 12px 11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--raise);position:relative;overflow:hidden;min-height:66px}
.mode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tc)}
.mode b{font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.05em;text-transform:uppercase;line-height:1;color:var(--tc)}
.mode span{font-size:12px;color:var(--muted)}
.mode em{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--taxi);border-radius:4px;padding:1px 5px;position:absolute;top:8px;right:8px}
.mode:hover:not(:disabled){border-color:var(--tc)}
.mode:disabled{opacity:.36}
.dests{display:flex;flex-wrap:wrap;gap:8px}
.dest-btn{font-family:var(--f-mono);font-weight:600;font-size:18px;min-width:56px;min-height:48px;border-radius:10px;background:var(--node);border:2px solid var(--node-edge)}
.dest-btn:hover{border-color:var(--text)}
.dest-btn.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.confirm{display:flex;gap:8px;flex-wrap:wrap}
.confirm .primary{flex:1 1 200px}
.hint{color:var(--muted);font-size:13px;margin:0}
.primary{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--text);color:var(--ink);font-size:15px}
.primary:hover:not(:disabled){filter:brightness(.92)}
.primary:disabled{opacity:.4}
.primary.tint{background:var(--tc)}
.secondary{border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-weight:600;background:var(--raise);text-decoration:none;text-align:center}
.secondary:hover:not(:disabled){border-color:var(--node-edge)}
.secondary.small,.primary.small{padding:7px 12px;font-size:13px}
.danger{border-color:rgba(255,93,108,.55);color:#ffb3ba}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:10px;background:var(--raise);border:1px solid var(--line);text-align:left;width:100%}
.toggle[aria-pressed="true"]{border-color:var(--smoke);background:rgba(169,140,255,.14)}
.toggle .sw{width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--smoke)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(16px);background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:0;border-radius:8px;padding:7px 11px;font-weight:600;font-size:13px;color:var(--ink);background:var(--tc)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.roster{display:flex;flex-direction:column;gap:7px}
.ag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.ag .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag .nm.on{font-weight:600}
.ag .at{font-family:var(--f-mono);color:var(--muted)}
.ag .mini{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:8px}
.ag .mini span{color:var(--tc)}
.ag .mini span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:currentColor}
.tlog{display:grid;grid-template-columns:repeat(auto-fill,minmax(27px,1fr));gap:4px}
.slot{border-radius:6px;background:var(--raise);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;padding:2px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;overflow:hidden}
.slot .n{font-size:9px;color:var(--muted)}
.slot .v{font-size:9px;font-weight:600}
.slot .p{font-size:11px;font-weight:600}
.slot.reveal{border-color:var(--smoke);border-width:2px}
.slot.t-taxi{background:var(--taxi);color:var(--ink)} .slot.t-bus{background:var(--bus);color:var(--ink)} .slot.t-train{background:var(--train);color:var(--ink)} .slot.t-smoke{background:var(--ink);color:var(--smoke);border-color:var(--smoke)}
.slot[class*="t-"] .n{color:inherit;opacity:.7}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;font-size:13px}
.loglist li{display:grid;grid-template-columns:34px auto minmax(0,1fr);gap:8px;align-items:center;padding:4px 6px;border-radius:6px;background:var(--raise)}
.loglist .tn{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.loglist .tt{font-size:11px;font-weight:600;color:var(--ink);background:var(--tc);border-radius:4px;padding:1px 6px;text-transform:uppercase;letter-spacing:.05em}
.loglist .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold summary::after{content:"Show";font-size:12px;color:var(--smoke);font-weight:600}
details.fold[open] summary::after{content:"Hide"}
details.fold summary::-webkit-details-marker{display:none}
.result h2{font-family:var(--f-display);font-weight:900;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:.03em;margin:4px 0;text-wrap:balance;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--raise);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.replay{display:flex;flex-direction:column;gap:8px}
.rp-btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rp-btns button{padding:8px 0;font-size:13px}
.replay input[type=range]{width:100%;accent-color:var(--smoke)}
.vlist{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.vlist.err li::marker{color:var(--train)}
.vlist.warn li::marker{color:var(--taxi)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 20px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.overlay.dim{background:rgba(6,10,18,.8);backdrop-filter:blur(3px)}
.overlay.solid{background:var(--ink);align-items:center}
#modal{z-index:30;align-items:center}
.sheet{width:100%;max-width:560px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet.wide{max-width:680px}
.sheet h1{font-family:var(--f-display);font-weight:900;font-size:52px;line-height:.9;letter-spacing:.04em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0}
.sheet p{margin:0;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:14px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:0 6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;box-sizing:border-box}
textarea.inp{font-family:var(--f-mono);font-size:12px;min-height:180px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:480px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:44px;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.seg button:disabled{opacity:.35}
.agent-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.agent-names .an{display:flex;align-items:center;gap:8px;min-width:0}
.agent-names .an .dot{width:12px;height:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions>*{flex:1 1 160px}
.err-box{color:#ffb3ba;font-size:14px;margin:0}
.rules{font-size:14px;color:var(--muted)}
.rules summary{cursor:pointer;color:var(--text);font-weight:600}
.rules ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--text)}
.cover{max-width:460px;text-align:center;align-items:center;gap:18px;padding:32px 24px}
.cover .big{width:56px;height:56px}
.cover .big.diamond{border-radius:8px}
.cover h1{font-size:46px}
.cover .primary{width:100%;padding:16px;font-size:16px}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.mapopt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.mapopt span{font-size:12px;color:var(--muted);font-weight:400}
.seg button[aria-pressed="true"] .mapopt span{color:var(--ink);opacity:.75}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><b>Shadow Trail</b><span id="subtitle">Port Veyra · after midnight</span></div>
    <div class="status" id="status"></div>
    <nav class="menu" aria-label="Game controls">
      <button class="ghost-btn" type="button" data-act="undo" id="undoBtn">Undo</button>
      <button class="ghost-btn" type="button" data-act="pause" id="pauseBtn">Pause</button>
      <button class="ghost-btn" type="button" data-act="rules">Rules</button>
      <button class="ghost-btn" type="button" data-act="end" id="endBtn">End game</button>
      <button class="ghost-btn" type="button" data-act="menu" id="menuBtn">Menu</button>
    </nav>
  </header>
  <main class="game">
    <section class="board" id="board">
      <svg id="map" viewBox="0 0 1200 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="City map"></svg>
      <div class="tools">
        <button type="button" class="sym" data-act="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" class="sym" data-act="zoom-in" aria-label="Zoom in">+</button>
        <button type="button" data-act="fit">Fit</button>
        <button type="button" data-act="fullscreen" id="fsBtn">Full screen</button>
      </div>
      <div class="legend" id="legend">
        <span><i style="background:var(--taxi)"></i>Taxi · street to the next crossing</span>
        <span><i style="background:var(--bus)"></i>Bus · teal-ringed stops</span>
        <span><i style="background:var(--train)"></i>Train · red-ringed stations</span>
        <span><i style="background:repeating-linear-gradient(90deg,var(--smoke) 0 6px,transparent 6px 10px)"></i>Ferry · Smoke tickets only</span>
      </div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>

<div class="overlay dim" id="setup" hidden></div>
<div class="overlay solid" id="cover" hidden></div>
<div class="overlay solid" id="pause" hidden></div>
<div class="overlay dim" id="modal" hidden></div>

<script>
(function(){
'use strict';

/* =====================================================================
   Utilities
   ===================================================================== */
const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isNarrow = () => window.matchMedia('(max-width: 900px)').matches;
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

const TK = {
  taxi:{label:'Taxi', short:'TAXI'}, bus:{label:'Bus', short:'BUS'}, train:{label:'Train', short:'TRN'},
  smoke:{label:'Smoke', short:'SMK'}, ferry:{label:'Ferry', short:'FRY'}, double:{label:'Double move', short:'2X'}
};
const MOVE_KINDS = ['taxi', 'bus', 'train'];
const EDGE_KINDS = ['taxi', 'bus', 'train', 'ferry'];
const AGENT_COLORS = ['#5cb8ff', '#ff7ac0', '#b4e468', '#e8edf6', '#d9a873'];
const AGENT_DEFAULTS = ['Harrow', 'Quill', 'Marlow', 'Vance', 'Ostrow'];
const KEYS = {game:'shadow-trail-game-v2', setup:'shadow-trail-setup-v2', map:'shadow-trail-map-v1'};

/* StorageManager: localStorage for game and settings, IndexedDB for a map's background picture */
const Store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise(res => {
      try {
        const r = indexedDB.open('shadow-trail', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('assets');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async getAsset(k){
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('assets').objectStore('assets').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async setAsset(k, v){
    const db = await this.open(); if (!db) return false;
    return new Promise(res => { try { const tx = db.transaction('assets', 'readwrite'); const st = tx.objectStore('assets'); if (v == null) st.delete(k); else st.put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
  }
};

/* Sound: short synthesized tones, only after a player has interacted */
const Sound = {
  ctx:null,
  on(){ return state ? state.cfg.sound : setupCfg.sound; },
  tone(f, dur = .09, type = 'triangle', vol = .06, delay = 0){
    if (!this.on()) return;
    try {
      this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + delay;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .03);
    } catch (e) {}
  },
  move(){ this.tone(520); },
  reveal(){ this.tone(392, .16, 'sine', .07); this.tone(587, .22, 'sine', .07, .13); },
  win(){ [523, 659, 784].forEach((f, i) => this.tone(f, .22, 'sine', .07, i * .13)); },
  lose(){ [392, 330, 262].forEach((f, i) => this.tone(f, .24, 'sine', .07, i * .15)); }
};

/* =====================================================================
   MapEngine: map data, graph, validation
   Map format (JSON):
   { name, w, h, nodes:[{id, x, y}] with x,y normalised 0..1,
     edges:[{a, b, t}] t in taxi|bus|train|ferry, starts:[id], style:{lines, labels, size} }
   Only listed crossings are playable. Links are undirected: a to b can be travelled both ways.
   ===================================================================== */
const veylY = x => 600 + 16 * Math.sin(x / 150 + .8);
function buildPortVeyra(){
  const COLS = 10, ROWS = 9, RIVER = 4, BRIDGES = [1, 4, 7], W = 1200, H = 1080;
  const id = (r, c) => r * COLS + c + 1;
  const rnd = rng(7319);
  const P = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    let x = 60 + c * 120 + (rnd() - .5) * 56;
    let y = 60 + r * 120 + (rnd() - .5) * 46;
    if (r === RIVER) y = 532 - rnd() * 22;
    if (r === RIVER + 1) y = 668 + rnd() * 22;
    P[id(r, c)] = {id:id(r, c), r, c, x:Math.round(x), y:Math.round(y)};
  }
  const taxi = [], diag = new Set();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++){
    if (c < COLS - 1) taxi.push({a:id(r, c), b:id(r, c + 1), ortho:true});
    if (r < ROWS - 1 && (r !== RIVER || BRIDGES.includes(c))) taxi.push({a:id(r, c), b:id(r + 1, c), ortho:true, bridge:r === RIVER});
  }
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++){
    if (r === RIVER) continue;
    if (rnd() < .3){
      diag.add(r + ',' + c);
      if (rnd() < .5) taxi.push({a:id(r, c), b:id(r + 1, c + 1)}); else taxi.push({a:id(r, c + 1), b:id(r + 1, c)});
    }
  }
  const alive = new Set(taxi);
  const deg = n => { let d = 0; alive.forEach(e => { if (e.a === n || e.b === n) d++; }); return d; };
  const connected = () => {
    const adj = {}; alive.forEach(e => { (adj[e.a] = adj[e.a] || []).push(e.b); (adj[e.b] = adj[e.b] || []).push(e.a); });
    const seen = new Set([1]), q = [1];
    while (q.length){ const n = q.pop(); for (const m of adj[n] || []) if (!seen.has(m)){ seen.add(m); q.push(m); } }
    return seen.size === ROWS * COLS;
  };
  const order = taxi.filter(e => e.ortho && !e.bridge).map(e => [rnd(), e]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
  let removed = 0;
  for (const e of order){
    if (removed >= 24) break;
    if (deg(e.a) <= 2 || deg(e.b) <= 2) continue;
    alive.delete(e);
    if (connected()) removed++; else alive.add(e);
  }
  const edges = [...alive].map(e => ({a:e.a, b:e.b, t:'taxi'}));
  const add = (pts, t) => { for (let i = 1; i < pts.length; i++) edges.push({a:id(...pts[i - 1]), b:id(...pts[i]), t}); };
  // Bus: four cross-town lines and five zig-zag lines that link them
  add([[1,0],[1,2],[1,4],[1,6],[1,8]], 'bus');
  add([[3,1],[3,3],[3,5],[3,7],[3,9]], 'bus');
  add([[5,0],[5,2],[5,4],[5,6],[5,8]], 'bus');
  add([[7,1],[7,3],[7,5],[7,7],[7,9]], 'bus');
  for (let k = 0; k < 5; k++) add([[1,2*k],[3,2*k+1],[5,2*k],[7,2*k+1]], 'bus');
  // Train: long jumps between nine stations
  [[[1,0],[1,4]],[[1,4],[1,8]],[[1,4],[3,5]],[[3,5],[5,2]],[[3,5],[5,6]],[[1,0],[5,2]],[[1,8],[5,6]],
   [[5,2],[7,1]],[[5,6],[7,5]],[[7,1],[7,5]],[[7,5],[7,9]],[[5,6],[7,9]],[[1,8],[7,9]]].forEach(([a, b]) => edges.push({a:id(...a), b:id(...b), t:'train'}));
  // Ferry along the river (Smoke tickets only)
  add([[4,0],[5,3],[4,6],[5,9]], 'ferry');
  const starts = [[0,2],[0,6],[0,9],[1,3],[2,0],[2,5],[2,8],[3,2],[4,4],[4,8],[5,1],[5,5],[6,3],[6,7],[6,9],[7,4],[8,1],[8,6]].map(p => id(...p));
  const blocks = [];
  const brnd = rng(99);
  for (let r = 0; r < ROWS - 1; r++) for (let c = 0; c < COLS - 1; c++){
    if (r === RIVER || diag.has(r + ',' + c)) continue;
    const q = [P[id(r, c)], P[id(r, c + 1)], P[id(r + 1, c + 1)], P[id(r + 1, c)]];
    const mx = q.reduce((s, p) => s + p.x, 0) / 4, my = q.reduce((s, p) => s + p.y, 0) / 4;
    blocks.push({p:q.map(p => `${(mx + (p.x - mx) * .62).toFixed(1)},${(my + (p.y - my) * .62).toFixed(1)}`).join(' '), park:brnd() < .14});
  }
  let river = '';
  for (let x = -40; x <= W + 40; x += 20) river += (x === -40 ? 'M' : 'L') + x + ' ' + veylY(x).toFixed(1);
  return {
    v:1, name:'Port Veyra', builtin:true, w:W, h:H,
    nodes:P.filter(Boolean).map(n => ({id:n.id, x:+(n.x / W).toFixed(5), y:+(n.y / H).toFixed(5)})),
    edges, starts, decor:{blocks, river}, style:{lines:true, labels:true, size:19}
  };
}

function prepare(raw){
  const m = Object.assign({}, raw);
  m.style = Object.assign({lines:true, labels:true, size:16}, raw.style || {});
  m.nodes = (raw.nodes || []).map(n => ({id:n.id, x:n.x, y:n.y, px:n.x * raw.w, py:n.y * raw.h}));
  m.byId = new Map(m.nodes.map(n => [n.id, n]));
  m.adj = new Map(m.nodes.map(n => [n.id, []]));
  m.kinds = new Map(m.nodes.map(n => [n.id, new Set()]));
  m.edges = [];
  const seen = new Set();
  for (const e of raw.edges || []){
    if (!m.byId.has(e.a) || !m.byId.has(e.b) || e.a === e.b || !EDGE_KINDS.includes(e.t)) continue;
    const k = Math.min(e.a, e.b) + '-' + Math.max(e.a, e.b) + '-' + e.t;
    if (seen.has(k)) continue;
    seen.add(k);
    m.edges.push({a:e.a, b:e.b, t:e.t});
    m.adj.get(e.a).push({to:e.b, t:e.t}); m.adj.get(e.b).push({to:e.a, t:e.t});
    m.kinds.get(e.a).add(e.t); m.kinds.get(e.b).add(e.t);
  }
  m.starts = (raw.starts || []).filter(id => m.byId.has(id));
  return m;
}

function validateMap(raw, players){
  const errors = [], warnings = [];
  const nodes = raw.nodes || [], edges = raw.edges || [];
  const ids = new Set();
  for (const n of nodes){
    if (!Number.isInteger(n.id) || n.id < 1) errors.push(`A crossing has the number "${n.id}". Numbers must be whole numbers from 1 up.`);
    else if (ids.has(n.id)) errors.push(`Crossing number ${n.id} is used twice.`);
    ids.add(n.id);
    if (!(n.x >= 0 && n.x <= 1 && n.y >= 0 && n.y <= 1)) errors.push(`Crossing ${n.id} is placed outside the map.`);
  }
  if (nodes.length < 6) errors.push(`The map has ${nodes.length} crossing${nodes.length === 1 ? '' : 's'}. It needs at least 6.`);
  const seen = new Set(), deg = new Map(), walk = new Map();
  nodes.forEach(n => { deg.set(n.id, 0); walk.set(n.id, []); });
  for (const e of edges){
    if (!EDGE_KINDS.includes(e.t)){ errors.push(`A link between ${e.a} and ${e.b} has an unknown transport "${e.t}".`); continue; }
    if (!ids.has(e.a) || !ids.has(e.b)){ errors.push(`A ${TK[e.t].label} link points to crossing ${!ids.has(e.a) ? e.a : e.b}, which does not exist.`); continue; }
    if (e.a === e.b){ errors.push(`Crossing ${e.a} has a ${TK[e.t].label} link to itself.`); continue; }
    const k = Math.min(e.a, e.b) + '-' + Math.max(e.a, e.b) + '-' + e.t;
    if (seen.has(k)) warnings.push(`The ${TK[e.t].label} link ${e.a}–${e.b} is listed twice. The copy is ignored.`);
    seen.add(k);
    deg.set(e.a, deg.get(e.a) + 1); deg.set(e.b, deg.get(e.b) + 1);
    if (e.t !== 'ferry'){ walk.get(e.a).push(e.b); walk.get(e.b).push(e.a); }
  }
  const lonely = nodes.filter(n => deg.get(n.id) === 0).map(n => n.id);
  if (lonely.length) warnings.push(`No links at crossing${lonely.length > 1 ? 's' : ''} ${lonely.slice(0, 12).join(', ')}${lonely.length > 12 ? '…' : ''}. Nobody can move to or from ${lonely.length > 1 ? 'them' : 'it'}.`);
  if (nodes.length && !errors.length){
    const first = nodes[0].id, s = new Set([first]), q = [first];
    while (q.length){ const n = q.pop(); for (const m of walk.get(n) || []) if (!s.has(m)){ s.add(m); q.push(m); } }
    if (s.size < nodes.length) warnings.push(`${nodes.length - s.size} crossing${nodes.length - s.size === 1 ? ' is' : 's are'} cut off from crossing ${first} by Taxi, Bus and Train.`);
  }
  const starts = raw.starts || [];
  const badStarts = starts.filter(id => !ids.has(id));
  if (badStarts.length) errors.push(`Starting spot${badStarts.length > 1 ? 's' : ''} ${badStarts.join(', ')} ${badStarts.length > 1 ? 'are' : 'is'} not on the map.`);
  if (players && starts.length < players) warnings.push(`Only ${starts.length} starting spot${starts.length === 1 ? '' : 's'} for ${players} players, so every crossing can be used as a start.`);
  if (players && nodes.length < players) errors.push(`The map has fewer crossings than players.`);
  return {errors, warnings};
}

const BUILTIN_RAW = buildPortVeyra();
const BUILTIN = prepare(BUILTIN_RAW);
let customRaw = Store.get(KEYS.map);
let customImage = null;

/* =====================================================================
   Settings and game state
   ===================================================================== */
const DEFAULT_CFG = {
  shadowName:'Shadow', agentCount:3, agentNames:AGENT_DEFAULTS.slice(), placement:'random', map:'builtin',
  tickets:{taxi:20, bus:10, train:5}, smoke:5, doubles:2, doubleOn:true, turns:24, revealsText:'3, 8, 13, 18, 24',
  tracker:true, sound:true, motion:true
};
let setupCfg = Object.assign(clone(DEFAULT_CFG), Store.get(KEYS.setup) || {});
setupCfg.tickets = Object.assign({}, DEFAULT_CFG.tickets, setupCfg.tickets || {});
if (!Array.isArray(setupCfg.agentNames) || setupCfg.agentNames.length < 5) setupCfg.agentNames = AGENT_DEFAULTS.slice();

let state = null;           // the whole game, including private information
let screen = 'setup';       // setup | game | editor
let history = [];           // undo snapshots: {side, snap}
const ui = {mode:null, selected:null, inspect:null, paused:false, showSuspects:true, replay:null, playing:null, setupErr:''};
const resetUi = () => { ui.mode = null; ui.selected = null; ui.inspect = null; };

function saveGame(){ if (state) Store.set(KEYS.game, state); }
function loadGame(){ const s = Store.get(KEYS.game); return s && s.v === 2 ? s : null; }

let mapCache = {src:null, img:null, m:null};
function MAP(){
  if (screen === 'editor') return Editor.prepared;
  if (!state || state.mapKey !== 'custom') return BUILTIN;
  if (mapCache.src !== state.mapData || mapCache.img !== customImage)
    mapCache = {src:state.mapData, img:customImage, m:prepare(Object.assign({}, state.mapData, {image:customImage}))};
  return mapCache.m;
}

function parseReveals(text, turns){
  const parts = String(text || '').split(/[\s,;]+/).filter(Boolean);
  const list = [];
  for (const p of parts){
    const n = Number(p);
    if (!Number.isInteger(n) || n < 1 || n > turns) return {error:`Sighting turns must be whole numbers between 1 and ${turns}. "${p}" is not.`};
    if (!list.includes(n)) list.push(n);
  }
  return {list:list.sort((a, b) => a - b)};
}

/* PlayerManager + TurnManager */
function newGame(cfg){
  const raw = cfg.map === 'custom' && customRaw ? customRaw : BUILTIN_RAW;
  const players = cfg.agentCount + 1;
  const v = validateMap(raw, players);
  if (v.errors.length){ ui.setupErr = 'The map has problems: ' + v.errors.join(' '); renderSetup(); return; }
  const m = prepare(raw);
  const pool = m.starts.length >= players ? m.starts.slice() : m.nodes.map(n => n.id);
  state = {
    v:2, cfg:clone(cfg), mapKey:cfg.map === 'custom' ? 'custom' : 'builtin', mapData:cfg.map === 'custom' ? clone(customRaw) : null,
    shadow:{name:(cfg.shadowName || '').trim() || 'Shadow', pos:null, start:null,
      tickets:Object.assign({}, cfg.tickets, {smoke:cfg.smoke, double:cfg.doubleOn ? cfg.doubles : 0})},
    agents:cfg.agentNames.slice(0, cfg.agentCount).map((n, i) => ({name:(n || '').trim() || AGENT_DEFAULTS[i], color:AGENT_COLORS[i], pos:null, start:null, tickets:Object.assign({}, cfg.tickets)})),
    pool, log:[], events:[], phase:'place', view:'', turnAgent:0, double:{armed:false, step:0},
    shadowDone:false, agentsDone:false, turnMoves:[], suspects:[], lastReveal:null, spottedFresh:false, roundMoved:false,
    winner:null, reason:''
  };
  history = []; resetUi(); ui.replay = null; ui.setupErr = ''; ui.paused = false;
  screen = 'game';
  if (cfg.placement === 'random'){
    const p = shuffle(pool.slice());
    state.shadow.pos = state.shadow.start = p[0];
    state.agents.forEach((a, i) => { a.pos = a.start = p[i + 1]; });
    beginPlay(false);
  } else {
    state.view = 'place-agents';
  }
  drawnMap = null;
  saveGame(); render();
}
function beginPlay(direct){
  state.suspects = state.pool.filter(id => !state.agents.some(a => a.pos === id));
  state.phase = 'shadow';
  state.view = direct ? 'shadow' : 'cover-shadow';
  if (direct && shadowOptions().size === 0) endGame('agents', `${state.shadow.name} has no way out of ${state.shadow.pos}.`);
}

/* MovementEngine */
function shadowOptions(){
  const m = MAP(), blocked = new Set(state.agents.map(a => a.pos)), T = state.shadow.tickets, out = new Map();
  for (const {to, t} of m.adj.get(state.shadow.pos) || []){
    if (blocked.has(to)) continue;
    const s = out.get(to) || new Set();
    if (t !== 'ferry' && T[t] > 0) s.add(t);
    if (T.smoke > 0) s.add('smoke');
    if (s.size) out.set(to, s);
  }
  return out;
}
function agentOptions(i){
  const m = MAP(), a = state.agents[i], out = new Map();
  const blocked = new Set(state.agents.filter((_, j) => j !== i).map(x => x.pos));
  for (const {to, t} of m.adj.get(a.pos) || []){
    if (blocked.has(to) || t === 'ferry' || !(a.tickets[t] > 0)) continue;
    const s = out.get(to) || new Set(); s.add(t); out.set(to, s);
  }
  return out;
}
function currentOptions(){
  if (!state || ui.paused || screen !== 'game') return new Map();
  if (state.view === 'shadow' && !state.shadowDone) return shadowOptions();
  if (state.view === 'agents' && !state.agentsDone) return agentOptions(state.turnAgent);
  return new Map();
}
function placeOptions(){
  if (!state) return [];
  const taken = new Set(state.agents.map(a => a.pos).filter(p => p != null));
  if (state.view === 'place-agents' || state.view === 'place-shadow') return state.pool.filter(id => !taken.has(id));
  return [];
}

/* Hidden movement */
function updateSuspects(ticket, revealed){
  if (revealed != null){ state.suspects = [revealed]; return; }
  const m = MAP(), blocked = new Set(state.agents.map(a => a.pos)), out = new Set();
  for (const n of state.suspects) for (const {to, t} of m.adj.get(n) || []){
    if (blocked.has(to)) continue;
    if (ticket === 'smoke' || t === ticket) out.add(to);
  }
  state.suspects = [...out];
}
/* GameHistory: undo snapshots of the complete state */
function pushHistory(side){ history.push({side, snap:JSON.stringify(state)}); if (history.length > 80) history.shift(); }
function canUndo(){
  const top = history[history.length - 1];
  if (!top || !state || screen !== 'game' || ui.paused) return false;
  return (top.side === 'shadow' && state.view === 'shadow') || (top.side === 'agents' && state.view === 'agents');
}
function undo(){
  if (!canUndo()) return;
  state = JSON.parse(history.pop().snap);
  resetUi(); saveGame(); render();
}

function commitMove(){
  const to = ui.selected, t = ui.mode;
  const opts = currentOptions();
  if (!to || !t || !opts.has(to) || !opts.get(to).has(t)) return;
  if (state.view === 'shadow') doShadowMove(to, t); else if (state.view === 'agents') doAgentMove(to, t);
}
function doShadowMove(to, t){
  pushHistory('shadow');
  const turn = state.log.length + 1, reveal = state.cfg.reveals.includes(turn), from = state.shadow.pos;
  if (state.double.armed && state.double.step === 1) state.shadow.tickets.double--;
  state.shadow.tickets[t]--;
  state.shadow.pos = to;
  state.log.push({turn, ticket:t, from, node:to, reveal});
  state.events.push({k:'s', from, to, t, turn});
  state.turnMoves.push({turn, ticket:t, from, node:to, reveal});
  updateSuspects(t, reveal ? to : null);
  if (reveal){ state.lastReveal = {node:to, turn}; state.spottedFresh = true; }
  if (state.double.armed && state.double.step === 1 && state.log.length < state.cfg.turns && shadowOptions().size){
    state.double.step = 2;
  } else {
    state.double = {armed:false, step:0};
    state.shadowDone = true;
  }
  Sound.move(); resetUi(); saveGame(); render();
}
function doAgentMove(to, t){
  pushHistory('agents');
  const i = state.turnAgent, a = state.agents[i], from = a.pos;
  a.tickets[t]--; a.pos = to; state.roundMoved = true;
  state.events.push({k:'a', i, from, to, t, turn:state.log.length});
  resetUi();
  if (to === state.shadow.pos){ endGame('agents', `${a.name} moved onto crossing ${to} and caught ${state.shadow.name}.`); return; }
  state.suspects = state.suspects.filter(n => n !== to);
  Sound.move();
  advanceAgent();
}
function advanceAgent(){
  state.turnAgent++;
  if (state.turnAgent >= state.agents.length){ state.turnAgent = state.agents.length - 1; state.agentsDone = true; }
  saveGame(); render();
  if (!state.agentsDone) View.centerOn(state.agents[state.turnAgent].pos);
}
function endRound(){
  if (!state.roundMoved) return endGame('shadow', `None of the agents could move, so ${state.shadow.name} slipped away.`);
  if (state.log.length >= state.cfg.turns) return endGame('shadow', `${state.shadow.name} stayed free for all ${state.cfg.turns} turns.`);
  if (shadowOptions().size === 0) return endGame('agents', `${state.shadow.name} is cornered at ${state.shadow.pos} with no way out.`);
  state.phase = 'shadow'; state.view = 'cover-shadow';
  state.shadowDone = false; state.agentsDone = false; state.turnMoves = []; state.spottedFresh = false; state.roundMoved = false; state.turnAgent = 0;
  history = [];
  resetUi(); saveGame(); render();
}
/* GameRules: end states */
function endGame(winner, reason){
  state.phase = 'over'; state.view = 'end'; state.winner = winner; state.reason = reason;
  history = []; resetUi(); ui.replay = state.events.length; ui.paused = false;
  if (winner === 'agents') Sound.win(); else if (winner === 'shadow') Sound.lose();
  saveGame(); render();
}

/* PrivacyManager: the renderer only reads this view model.
   On public screens the Shadow's position, start and hidden route are left out entirely, not hidden with CSS. */
const PRIVATE_VIEWS = ['shadow', 'place-shadow', 'end'];
function viewModel(){
  const priv = PRIVATE_VIEWS.includes(state.view);
  const s = state.shadow;
  return {
    priv,
    shadow:priv ? {name:s.name, pos:s.pos, start:s.start, tickets:Object.assign({}, s.tickets)} : {name:s.name, pos:null, start:null, tickets:{smoke:s.tickets.smoke, double:s.tickets.double}},
    agents:state.agents.map(a => ({name:a.name, color:a.color, pos:a.pos, start:a.start, tickets:Object.assign({}, a.tickets)})),
    log:state.log.map(e => priv ? Object.assign({}, e) : {turn:e.turn, ticket:e.ticket, reveal:e.reveal, node:e.reveal ? e.node : null, from:null}),
    agentEvents:state.events.filter(e => e.k === 'a'),
    events:priv ? state.events : null,
    lastReveal:state.lastReveal, suspects:state.suspects
  };
}

   UIRenderer: map
   ===================================================================== */
const svg = $('#map');
const L = {};
['base', 'suspects', 'route', 'hl', 'tokens', 'edit', 'hit'].forEach(k => { L[k] = mk('g', {}, svg); });
let drawnMap = null;

function edgePath(m, e){
  const A = m.byId.get(e.a), B = m.byId.get(e.b);
  if (m.decor && e.t === 'ferry'){ const mx = (A.px + B.px) / 2; return `M${A.px} ${A.py}Q${mx} ${veylY(mx).toFixed(1)} ${B.px} ${B.py}`; }
  const off = m.builtin ? (e.t === 'bus' ? 16 : e.t === 'train' ? -26 : 0) : 0;
  if (!off) return `M${A.px} ${A.py}L${B.px} ${B.py}`;
  const dx = B.px - A.px, dy = B.py - A.py, len = Math.hypot(dx, dy) || 1;
  return `M${A.px} ${A.py}Q${((A.px + B.px) / 2 - dy / len * off).toFixed(1)} ${((A.py + B.py) / 2 + dx / len * off).toFixed(1)} ${B.px} ${B.py}`;
}
function drawMap(m){
  const g = L.base; g.replaceChildren(); L.hit.replaceChildren();
  const R = m.style.size, s = R / 19;
  if (m.image) mk('image', {href:m.image, x:0, y:0, width:m.w, height:m.h, preserveAspectRatio:'none'}, g);
  else mk('rect', {x:0, y:0, width:m.w, height:m.h, class:'ground'}, g);
  if (m.decor){
    for (const b of m.decor.blocks) mk('polygon', {points:b.p, class:'blk' + (b.park ? ' park' : '')}, g);
    mk('path', {d:m.decor.river, class:'river-edge', id:'riverPath', 'stroke-width':64}, g);
    mk('path', {d:m.decor.river, class:'river', 'stroke-width':58}, g);
    const tx = mk('text', {class:'river-name', dy:5, 'font-size':15}, g);
    mk('textPath', {href:'#riverPath', startOffset:'30%'}, tx).textContent = 'RIVER VEYL';
  }
  if (m.style.lines){
    const eg = mk('g', {}, g);
    if (m.decor) for (const e of m.edges) if (e.t === 'taxi'){
      const A = m.byId.get(e.a), B = m.byId.get(e.b);
      if ((A.py - 600) * (B.py - 600) < 0) mk('path', {d:edgePath(m, e), class:'e e-casing', 'stroke-width':15 * s}, eg);
    }
    const W = {taxi:3.5, bus:5, train:6, ferry:4};
    for (const t of EDGE_KINDS) for (const e of m.edges) if (e.t === t)
      mk('path', {d:edgePath(m, e), class:'e e-' + t, 'stroke-width':W[t] * s, 'stroke-dasharray':t === 'ferry' ? `${10 * s} ${9 * s}` : null}, eg);
  }
  const ng = mk('g', {}, g);
  for (const n of m.nodes){
    const k = m.kinds.get(n.id);
    if (m.style.labels){
      if (k.has('ferry')) mk('circle', {cx:n.px, cy:n.py, r:R * (k.has('train') ? 1.68 : 1.37), class:'n-pier', 'stroke-width':3 * s, 'stroke-dasharray':`${5 * s} ${4 * s}`}, ng);
      if (k.has('train')) mk('circle', {cx:n.px, cy:n.py, r:R * 1.32, class:'n-train', 'stroke-width':4 * s}, ng);
      mk('circle', {cx:n.px, cy:n.py, r:R, class:'n-core' + (k.has('bus') ? ' bus' : ''), 'stroke-width':(k.has('bus') ? 4 : 3) * s}, ng);
      mk('text', {x:n.px, y:n.py + s, class:'n-label', 'font-size':R}, ng).textContent = n.id;
    } else {
      mk('circle', {cx:n.px, cy:n.py, r:R, class:'n-ring', 'stroke-width':2.5 * s}, ng);
    }
    mk('circle', {cx:n.px, cy:n.py, r:R * 1.8, class:'hit', 'data-node':n.id}, L.hit);
  }
  $('#legend').hidden = !m.style.lines && !!m.image;
}

/* Pan and zoom by moving the viewBox, so markers always stay on their crossings */
const View = {
  x:0, y:0, w:1200, h:1080, mw:1200, mh:1080,
  apply(){ svg.setAttribute('viewBox', `${this.x.toFixed(1)} ${this.y.toFixed(1)} ${this.w.toFixed(1)} ${this.h.toFixed(1)}`); },
  fitTo(m){ this.mw = m.w; this.mh = m.h; this.fit(); },
  fit(){ const p = this.mw * .02; this.x = -p; this.y = -p; this.w = this.mw + 2 * p; this.h = this.mh + 2 * p; this.apply(); },
  zoom(f, cx, cy){
    if (cx == null){ cx = this.x + this.w / 2; cy = this.y + this.h / 2; }
    const nw = clamp(this.w / f, this.mw / 10, this.mw * 1.3), k = nw / this.w;
    this.x = cx - (cx - this.x) * k; this.y = cy - (cy - this.y) * k; this.w = nw; this.h *= k; this.apply();
  },
  centerOn(id){
    const n = MAP().byId.get(id); if (!n) return;
    if (isNarrow() && this.w > this.mw * .75){ const k = (this.mw / 1.8) / this.w; this.w *= k; this.h *= k; }
    if (this.w > this.mw * .95) return;
    this.x = n.px - this.w / 2; this.y = n.py - this.h / 2; this.apply();
  },
  scale(){ const r = svg.getBoundingClientRect(); return Math.max(this.w / (r.width || 1), this.h / (r.height || 1)); }
};
function toSvg(cx, cy){ const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; const ctm = svg.getScreenCTM(); return ctm ? pt.matrixTransform(ctm.inverse()) : {x:0, y:0}; }

const ptr = {pts:new Map(), down:null, dragged:false, v0:null, pinch:null, nodeDrag:null, sc:1};
svg.addEventListener('pointerdown', e => {
  try { svg.setPointerCapture(e.pointerId); } catch (err) {}
  ptr.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptr.pts.size === 1){
    const hit = e.target.closest ? e.target.closest('[data-node]') : null;
    ptr.down = {x:e.clientX, y:e.clientY, node:hit ? +hit.dataset.node : null};
    ptr.dragged = false; ptr.v0 = {x:View.x, y:View.y}; ptr.sc = View.scale();
    ptr.nodeDrag = screen === 'editor' && Editor.tool === 'move' && hit ? +hit.dataset.node : null;
  } else if (ptr.pts.size === 2){
    const [a, b] = [...ptr.pts.values()];
    ptr.pinch = {d:Math.hypot(a.x - b.x, a.y - b.y) || 1, w:View.w};
    ptr.dragged = true;
  }
});
svg.addEventListener('pointermove', e => {
  if (!ptr.pts.has(e.pointerId)) return;
  ptr.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptr.pts.size === 2 && ptr.pinch){
    const [a, b] = [...ptr.pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mid = toSvg((a.x + b.x) / 2, (a.y + b.y) / 2);
    View.zoom(View.w / (ptr.pinch.w * ptr.pinch.d / d), mid.x, mid.y);
    return;
  }
  if (!ptr.down) return;
  const dx = e.clientX - ptr.down.x, dy = e.clientY - ptr.down.y;
  if (!ptr.dragged && Math.hypot(dx, dy) > 6){ ptr.dragged = true; if (ptr.nodeDrag) Editor.snap(); else svg.classList.add('dragging'); }
  if (!ptr.dragged) return;
  if (ptr.nodeDrag){ Editor.dragTo(ptr.nodeDrag, toSvg(e.clientX, e.clientY)); }
  else { View.x = ptr.v0.x - dx * ptr.sc; View.y = ptr.v0.y - dy * ptr.sc; View.apply(); }
});
function endPtr(e, cancel){
  ptr.pts.delete(e.pointerId);
  if (ptr.pts.size < 2) ptr.pinch = null;
  if (ptr.pts.size === 0){
    if (!cancel && ptr.down && !ptr.dragged) onMapTap(ptr.down.node, toSvg(e.clientX, e.clientY));
    if (ptr.nodeDrag && ptr.dragged) Editor.refresh();
    ptr.down = null; ptr.nodeDrag = null; svg.classList.remove('dragging');
  }
}
svg.addEventListener('pointerup', e => endPtr(e, false));
svg.addEventListener('pointercancel', e => endPtr(e, true));
svg.addEventListener('wheel', e => { e.preventDefault(); const p = toSvg(e.clientX, e.clientY); View.zoom(e.deltaY < 0 ? 1.18 : 1 / 1.18, p.x, p.y); }, {passive:false});

function onMapTap(id, pt){
  if (screen === 'editor') return Editor.tap(id, pt);
  if (screen !== 'game' || !state || ui.paused || state.view.startsWith('cover')) return;
  if (id == null){ ui.inspect = null; if (state.view !== 'end') ui.selected = null; render(); return; }
  ui.inspect = id;
  if (state.view === 'place-agents' || state.view === 'place-shadow'){
    ui.selected = placeOptions().includes(id) ? id : null;
  } else {
    const set = currentOptions().get(id);
    if (set){
      if (ui.mode && set.has(ui.mode)) ui.selected = id;
      else if (set.size === 1){ ui.mode = [...set][0]; ui.selected = id; }
      else ui.selected = null;
    } else ui.selected = null;
  }
  render();
}

function renderBoard(){
  const m = MAP();
  if (m !== drawnMap){
    drawMap(m);
    if (!drawnMap || View.mw !== m.w || View.mh !== m.h) View.fitTo(m);
    drawnMap = m;
  }
  for (const k of ['suspects', 'route', 'hl', 'tokens', 'edit']) L[k].replaceChildren();
  if (screen === 'editor') return Editor.drawOverlay();
  if (screen !== 'game' || !state || state.view.startsWith('cover') || ui.paused) return;
  const P = viewModel(), v = state.view, R = m.style.size, s = R / 19, N = id => m.byId.get(id);

  if (state.cfg.tracker && ui.showSuspects && (v === 'agents' || v === 'shadow'))
    for (const id of P.suspects){ const n = N(id); if (n) mk('circle', {cx:n.px, cy:n.py, r:R * 1.5, class:'suspect', 'stroke-width':2 * s}, L.suspects); }

  let agentPos = P.agents.map(a => a.pos), shadowPos = P.shadow.pos;
  if (v === 'end' && P.events){
    const k = ui.replay == null ? P.events.length : ui.replay;
    agentPos = P.agents.map(a => a.start); shadowPos = P.shadow.start;
    const path = [shadowPos];
    P.events.slice(0, k).forEach(e => { if (e.k === 's'){ shadowPos = e.to; path.push(e.to); } else agentPos[e.i] = e.to; });
    mk('polyline', {points:path.map(id => `${N(id).px},${N(id).py}`).join(' '), class:'route', 'stroke-width':7 * s}, L.route);
    path.slice(1).forEach((id, i) => {
      const n = N(id);
      mk('circle', {cx:n.px + R * 1.25, cy:n.py - R * 1.25, r:R * .6, class:'route-dot'}, L.route);
      mk('text', {x:n.px + R * 1.25, y:n.py - R * 1.2, class:'tok-label', 'font-size':R * .62}, L.route).textContent = i + 1;
    });
  }
  if (v === 'agents' && P.lastReveal){
    const n = N(P.lastReveal.node);
    mk('circle', {cx:n.px, cy:n.py, r:R * 1.75, class:'seen-ring', 'stroke-width':3 * s, 'stroke-dasharray':`${4 * s} ${5 * s}`}, L.hl);
    mk('rect', {x:n.px - R * 2.1, y:n.py - R * 3.3, width:R * 4.2, height:R * 1.2, rx:R * .3, class:'seen-tag'}, L.hl);
    mk('text', {x:n.px, y:n.py - R * 2.7, class:'seen-text', 'font-size':R * .72}, L.hl).textContent = 'SEEN · T' + P.lastReveal.turn;
  }
  const ring = (id, faint) => {
    const n = N(id), on = ui.selected === id;
    mk('circle', {cx:n.px, cy:n.py, r:R * 1.5, class:'dest' + (faint ? ' faint' : '') + (on ? ' picked' : ''), 'stroke-width':(on ? 5 : 3) * s, 'stroke-dasharray':on ? null : `${7 * s} ${6 * s}`}, L.hl);
  };
  if (v === 'place-agents' || v === 'place-shadow') placeOptions().forEach(id => ring(id, false));
  else for (const [id, set] of currentOptions()){ if (!ui.mode || set.has(ui.mode)) ring(id, !ui.mode); }
  if (ui.inspect && N(ui.inspect)){ const n = N(ui.inspect); mk('circle', {cx:n.px, cy:n.py, r:R * 1.95, class:'inspect', 'stroke-width':2 * s, 'stroke-dasharray':`${2 * s} ${4 * s}`}, L.hl); }

  P.agents.forEach((a, i) => {
    const pos = agentPos[i]; if (pos == null) return;
    const n = N(pos);
    if (v === 'agents' && !state.agentsDone && i === state.turnAgent) mk('circle', {cx:n.px, cy:n.py, r:R * 1.65, class:'cur-ring', stroke:a.color, 'stroke-width':4 * s}, L.tokens);
    mk('circle', {cx:n.px, cy:n.py, r:R * 1.16, fill:a.color, stroke:'#0a0f1a', 'stroke-width':4 * s}, L.tokens);
    mk('text', {x:n.px, y:n.py + s, class:'tok-label', 'font-size':R * .95}, L.tokens).textContent = pos;
  });
  if (shadowPos != null){
    const n = N(shadowPos), caught = agentPos.includes(shadowPos);
    const x = caught ? n.px + R * 1.35 : n.px, y = caught ? n.py + R * 1.35 : n.py, h = R * .9;
    mk('rect', {x:x - h, y:y - h, width:h * 2, height:h * 2, rx:R * .2, transform:`rotate(45 ${x} ${y})`, fill:'var(--smoke)', stroke:'#fff', 'stroke-width':3 * s}, L.tokens);
    mk('text', {x, y:y + s, class:'tok-label', 'font-size':R * .95}, L.tokens).textContent = shadowPos;
  }
}

const wallet = (T, keys) => `<div class="wallet">${keys.map(k => `<span class="tk k-${k}${T[k] ? '' : ' zero'}"><b>${T[k]}</b>${TK[k].label}</span>`).join('')}</div>`;
const goLabel = (m, id) => m === 'smoke' ? `Use Smoke to reach ${id}` : `Take the ${TK[m].label} to ${id}`;
function transportStep(opts, T, kinds){
  if (!ui.mode){
    const reach = k => [...opts.values()].filter(s => s.has(k)).length;
    return `<div class="step"><span class="eyebrow">Step 1 · Choose how to travel</span><div class="modes">${kinds.map(k => {
      const n = reach(k), off = !T[k] || !n, low = T[k] > 0 && T[k] <= 2;
      return `<button type="button" class="mode k-${k}" data-act="mode" data-m="${k}"${off ? ' disabled' : ''}>${low ? '<em>Low</em>' : ''}<b>${TK[k].label}</b><span>${T[k]} ticket${T[k] === 1 ? '' : 's'} · ${!T[k] ? 'none left' : n ? n + ' place' + (n > 1 ? 's' : '') + ' to go' : 'no route from here'}</span></button>`;
    }).join('')}</div><p class="hint">Or tap a faint ring on the map.</p></div>`;
  }
  const dests = [...opts.keys()].filter(id => opts.get(id).has(ui.mode)).sort((a, b) => a - b);
  let h = `<div class="step"><div class="step-head"><span class="eyebrow">Step 2 · Choose where to go by ${TK[ui.mode].label}</span><button type="button" class="link" data-act="mode" data-m="">Change transport</button></div>
    <div class="dests">${dests.map(id => `<button type="button" class="dest-btn${ui.selected === id ? ' on' : ''}" data-act="pick" data-to="${id}">${id}</button>`).join('')}</div>`;
  h += ui.selected && dests.includes(ui.selected)
    ? `<div class="confirm"><button type="button" class="primary tint k-${ui.mode}" data-act="confirm">${goLabel(ui.mode, ui.selected)}</button><button type="button" class="secondary" data-act="cancel">Cancel</button></div>`
    : `<p class="hint">Tap a number above or a ringed crossing on the map.</p>`;
  return h + '</div>';
}
function placeStep(who){
  const opts = placeOptions().slice().sort((a, b) => a - b);
  return `<div class="step"><span class="eyebrow">Choose a starting crossing for ${esc(who)}</span>
    <div class="dests">${opts.map(id => `<button type="button" class="dest-btn${ui.selected === id ? ' on' : ''}" data-act="pick" data-to="${id}">${id}</button>`).join('')}</div>
    ${ui.selected ? `<div class="confirm"><button type="button" class="primary" data-act="confirm-place">Start ${esc(who)} at ${ui.selected}</button><button type="button" class="secondary" data-act="cancel">Cancel</button></div>` : '<p class="hint">Tap a number above or a ringed crossing on the map.</p>'}</div>`;
}
function infoCard(P){
  const id = ui.inspect, m = MAP();
  if (!id || !m.byId.has(id)) return '';
  const groups = EDGE_KINDS.map(t => [t, [...new Set(m.adj.get(id).filter(x => x.t === t).map(x => x.to))].sort((a, b) => a - b)]).filter(g => g[1].length);
  const here = P.agents.filter(a => a.pos === id).map(a => esc(a.name));
  if (P.shadow.pos === id) here.push(esc(P.shadow.name));
  let reach = '';
  if ((state.view === 'shadow' && !state.shadowDone) || (state.view === 'agents' && !state.agentsDone)){

    reach = set ? `<div class="chips">${['taxi','bus','train','smoke'].filter(t => set.has(t)).map(t => `<button type="button" class="chip-btn k-${t}" data-act="go-via" data-to="${id}" data-t="${t}">Go by ${TK[t].label}</button>`).join('')}</div>`
      : `<p class="hint">${id === mine ? 'This is where you are.' : 'You cannot move here this turn.'}</p>`;
  }
  return `<div class="card"><div class="step-head"><span class="eyebrow">Crossing ${id}</span><button type="button" class="link" data-act="uninspect">Close</button></div>
    <dl class="kv">${groups.map(([t, l]) => `<dt>${TK[t].label}</dt><dd>${l.join(', ')}</dd>`).join('') || '<dt>Links</dt><dd>none</dd>'}<dt>Here now</dt><dd>${here.join(', ') || 'nobody'}</dd></dl>${reach}</div>`;
}
function travelLog(P, showAll){
  const total = state.cfg.turns, reveals = state.cfg.reveals, next = reveals.find(r => r > state.log.length);
  let h = '<div class="tlog">';
  for (let i = 1; i <= total; i++){
    const e = P.log[i - 1], rv = reveals.includes(i);

  return `<div class="card"><div class="eyebrow">${esc(P.shadow.name)}'s travel log${next && state.phase !== 'over' ? ` · next sighting on turn ${next}` : ''}</div>${h}${trk}</div>`;

function agentLog(P){
  const ev = P.agentEvents.slice().reverse();

function privateLog(P){

    <p class="hint">Started at ${P.shadow.start}.</p></div>`;

function roster(P){
  return `<div class="card"><div class="eyebrow">Players</div><div class="roster">

function replayText(k){
  if (!state) return '';
  if (k <= 0) return `Starting positions. ${esc(state.shadow.name)} began at ${state.shadow.start}.`;
  const e = state.events[k - 1];
  const who = e.k === 's' ? state.shadow.name : state.agents[e.i].name;
  return `Move ${k} of ${state.events.length}, turn ${e.turn}: ${esc(who)} took the ${TK[e.t].label} from ${e.from} to ${e.to}.`;
}

function readSetup(){
