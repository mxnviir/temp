<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 11 Marks Calculator</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#3b5bdb; --line:#dfe3ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b1f2a; --text:#e8ebf2; --muted:#98a0b3; --accent:#7c93ff; --line:#2c3242; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,sans-serif; }
  main { max-width:900px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:1.1rem; margin:0 0 12px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .card h2 span { color:var(--accent); font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:4px; }
  input { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:1rem; }
  input.bad { border-color:#e03131; }
  .row { margin-top:10px; color:var(--muted); font-size:.85rem; }
  .row b { color:var(--text); }
  #result table { width:100%; border-collapse:collapse; }
  #result th, #result td { text-align:left; padding:8px 4px; border-bottom:1px solid var(--line); }
  #result td:not(:first-child), #result th:not(:first-child) { text-align:right; }
  .total { font-size:1.4rem; font-weight:700; color:var(--accent); }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button.alt { background:transparent; color:var(--text); border:1px solid var(--line); margin-left:8px; }
</style>
</head>
<body>
<main>
  <h1>Grade 11 Marks Calculator</h1>
  <p class="sub">Enter your marks. Leave blank to count as 0.</p>
  <div id="subjects"></div>
  <div class="card">
    <button id="calc">Calculate result</button>
    <button id="reset" class="alt">Reset</button>
  </div>
  <div class="card" id="result" hidden></div>
</main>

<script>
// Each subject: UT out of 35 (UT1, UT2); per SA term: theory + practical.
// conv = [rawMax, convertedMax] converts raw theory to its scaled marks.
// pracMax = practical max per SA (0 = none). theory SA max for math/English is editable.
const SUBJECTS = [
  { id:'phy',  name:'Physics',   theory:75, conv:70, prac:30 },
  { id:'chem', name:'Chemistry', theory:75, conv:70, prac:30 },
  { id:'math', name:'Math',      theory:100, conv:100, prac:0, editable:true },
  { id:'eng',  name:'English',   theory:100, conv:100, prac:0, editable:true },
  { id:'ai',   name:'AI',        theory:55, conv:50, prac:50 },
];
const UT_MAX = 35;

const $ = id => document.getElementById(id);
const num = id => { const v = parseFloat($(id).value); return isNaN(v) ? 0 : v; };

function field(id, label, max) {
  return `<div><label for="${id}">${label} (/ <span id="${id}-max">${max}</span>)</label>
    <input type="number" id="${id}" min="0" max="${max}" step="any" inputmode="decimal"></div>`;
}

function build() {
  $('subjects').innerHTML = SUBJECTS.map(s => {
    let h = `<div class="card"><h2>${s.name}</h2><div class="grid">`;
    h += field(`${s.id}-ut1`, 'UT 1', UT_MAX);
    for (const t of [1, 2]) {
      h += field(`${s.id}-sa${t}t`, `SA ${t} Theory`, s.theory);
      if (s.prac) h += field(`${s.id}-sa${t}p`, `SA ${t} Practical`, s.prac);
    }
    h += field(`${s.id}-ut2`, 'UT 2', UT_MAX);
    h += '</div>';
    if (s.editable)
      h += `<div class="row">SA theory max marks: <input type="number" id="${s.id}-samax" value="${s.theory}" min="1" style="width:90px"></div>`;
    else if (s.conv !== s.theory)
      h += `<div class="row">SA theory is converted: marks/${s.theory} &times; ${s.conv}</div>`;
    return h + '</div>';
  }).join('');

  for (const s of SUBJECTS) {
    if (!s.editable) continue;
    $(`${s.id}-samax`).addEventListener('input', () => {
      const m = Math.max(1, num(`${s.id}-samax`));
      for (const t of [1, 2]) {
        $(`${s.id}-sa${t}t-max`).textContent = m;
        $(`${s.id}-sa${t}t`).max = m;
      }
    });
  }
}

function check(id) {
  const el = $(id);
  const bad = el.value !== '' && (parseFloat(el.value) < 0 || parseFloat(el.value) > parseFloat(el.max));
  el.classList.toggle('bad', bad);
  return bad;
}

const r2 = x => Math.round(x * 100) / 100;

function calcSubject(s) {
  const theoryMax = s.editable ? Math.max(1, num(`${s.id}-samax`)) : s.theory;
  const ut = num(`${s.id}-ut1`) + num(`${s.id}-ut2`);
  let sa = 0;
  for (const t of [1, 2]) {
    sa += num(`${s.id}-sa${t}t`) / theoryMax * s.conv; // scale theory to converted max
    if (s.prac) sa += num(`${s.id}-sa${t}p`);
  }
  const saMax = 2 * (s.conv + s.prac);
  return { ut, utMax: 2 * UT_MAX, sa, saMax, total: ut + sa, max: 2 * UT_MAX + saMax };
}

function calculate() {
  let anyBad = false;
  document.querySelectorAll('#subjects input[type=number][max]').forEach(i => { if (i.id && check(i.id)) anyBad = true; });
  if (anyBad) { alert('Some marks are above the maximum or negative. Fix the red boxes.'); return; }

  let gT = 0, gM = 0;
  const rows = SUBJECTS.map(s => {
    const r = calcSubject(s); gT += r.total; gM += r.max;
    return `<tr><td>${s.name}</td><td>${r2(r.ut)}/${r.utMax}</td><td>${r2(r.sa)}/${r.saMax}</td>
      <td>${r2(r.total)}/${r.max}</td><td>${r2(r.total / r.max * 100)}%</td></tr>`;
  }).join('');

  const pct = gT / gM * 100;
  $('result').hidden = false;
  $('result').innerHTML = `<h2>Final Result</h2>
    <table><tr><th>Subject</th><th>Unit Tests</th><th>SA 1 + SA 2</th><th>Total</th><th>%</th></tr>${rows}
    <tr><td><b>Overall</b></td><td></td><td></td><td class="total">${r2(gT)}/${gM}</td><td class="total">${r2(pct)}%</td></tr></table>`;
  $('result').scrollIntoView({ behavior:'smooth' });
}

build();
$('calc').addEventListener('click', calculate);
$('reset').addEventListener('click', () => {
  document.querySelectorAll('#subjects input').forEach(i => { if (!i.id.endsWith('-samax')) { i.value = ''; i.classList.remove('bad'); } });
  $('result').hidden = true;
});
</script>
</body>
</html>
